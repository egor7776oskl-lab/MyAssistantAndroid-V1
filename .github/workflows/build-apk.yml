name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        run: |
          mkdir project
          unzip -q MyAssistant_Android_V1_Build.zip -d project
                - name: Configure Java 17
        working-directory: project
        run: printf '%s\n' 'allprojects {' '  tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {' '    sourceCompatibility = "17"' '    targetCompatibility = "17"' '  }' '}' > jvm.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: project
        run: gradle --init-script jvm.gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAssistant-V1-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
